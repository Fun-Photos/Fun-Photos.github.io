<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Fun Photos</title>
  <meta name="theme-color" content="#090d16">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script>
    // If the not-found path is under the /photo-background/ application, recover by routing to the app
    (function() {
      const path = window.location.pathname;
      if (path.startsWith('/photo-background')) {
        // Fallback into the photo-background app shell
        window.location.replace('/photo-background/' + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #00e5ff 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .not-found-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem;
      color: #f8fafc;
    }
    .not-found-text {
      font-size: 1rem;
      color: #94a3b8;
      max-width: 480px;
      margin: 0 0 2rem;
      line-height: 1.6;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">Page Not Found</h2>
    <p class="not-found-text">
      The page you were looking for doesn't exist or has moved. You can return to the portal home or launch the photo studio.
    </p>
    <div class="not-found-actions">
      <a href="/" class="btn btn-secondary">Return Home</a>
      <a href="/photo-background/" class="btn btn-primary">Launch Studio</a>
    </div>
  </div>
</body>
</html>
