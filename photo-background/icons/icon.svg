<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Inner Rounded Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Backdrop Layer (representing background swap) -->
  <rect x="110" y="110" width="292" height="292" rx="36" fill="url(#accentGrad)" opacity="0.2"/>
  <rect x="130" y="130" width="252" height="252" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4"/>

  <!-- Camera Body -->
  <path d="M 170 190 L 200 160 L 312 160 L 342 190 L 372 190 C 388 190 402 204 402 220 L 402 332 C 402 348 388 362 372 362 L 140 362 C 124 362 110 348 110 332 L 110 220 C 110 204 124 190 140 190 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8"/>
  
  <!-- Flash Dot -->
  <circle cx="360" cy="220" r="12" fill="#fbbf24"/>
  
  <!-- Lens Rings -->
  <circle cx="256" cy="276" r="64" fill="url(#lensGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="276" r="48" fill="#0f172a"/>
  <circle cx="256" cy="276" r="32" fill="url(#accentGrad)"/>
  <circle cx="244" cy="264" r="10" fill="#ffffff" opacity="0.8"/>
  
  <!-- Magic Wand / Sparkle -->
  <path d="M 390 120 Q 390 145 415 145 Q 390 145 390 170 Q 390 145 365 145 Q 390 145 390 120 Z" fill="#38bdf8"/>
  <path d="M 120 390 Q 120 405 135 405 Q 120 405 120 420 Q 120 405 105 405 Q 120 405 120 390 Z" fill="#ec4899"/>
</svg>
