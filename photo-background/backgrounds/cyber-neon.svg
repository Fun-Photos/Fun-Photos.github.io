<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#64115b"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffee00"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#skyNeon)"/>

  <!-- Synth Sun -->
  <circle cx="960" cy="560" r="220" fill="url(#sunGrad)"/>
  <!-- Sun Horizontal Blinds -->
  <rect x="700" y="520" width="520" height="6" fill="#2a0845"/>
  <rect x="700" y="545" width="520" height="10" fill="#2a0845"/>
  <rect x="700" y="575" width="520" height="16" fill="#2a0845"/>
  <rect x="700" y="615" width="520" height="24" fill="#2a0845"/>
  <rect x="700" y="665" width="520" height="34" fill="#2a0845"/>

  <!-- Mountains -->
  <polygon points="100,680 400,450 700,680" fill="#130826" stroke="#00ffff" stroke-width="2"/>
  <polygon points="500,680 780,480 1100,680" fill="#0f0520" stroke="#ff007f" stroke-width="2"/>
  <polygon points="1200,680 1550,420 1850,680" fill="#130826" stroke="#00ffff" stroke-width="2"/>

  <!-- Ground Grid Floor -->
  <rect y="680" width="1920" height="400" fill="#06020c"/>
  <line x1="0" y1="680" x2="1920" y2="680" stroke="#00ffff" stroke-width="4"/>
  <line x1="0" y1="710" x2="1920" y2="710" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="750" x2="1920" y2="750" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="810" x2="1920" y2="810" stroke="#ff007f" stroke-width="3" opacity="0.8"/>
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#ff007f" stroke-width="4"/>
  <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#ff007f" stroke-width="6"/>

  <!-- Perspective grid lines -->
  <line x1="960" y1="680" x2="960" y2="1080" stroke="#00ffff" stroke-width="2"/>
  <line x1="960" y1="680" x2="400" y2="1080" stroke="#00ffff" stroke-width="2"/>
  <line x1="960" y1="680" x2="-200" y2="1080" stroke="#00ffff" stroke-width="2"/>
  <line x1="960" y1="680" x2="1520" y2="1080" stroke="#00ffff" stroke-width="2"/>
  <line x1="960" y1="680" x2="2120" y2="1080" stroke="#00ffff" stroke-width="2"/>
</svg>
