  <rect x="500" y="280" width="28" height="14" rx="3" fill="#ec4899" transform="rotate(-40 500 280)"/>
  <rect x="820" y="180" width="20" height="10" rx="2" fill="#06b6d4" transform="rotate(60 820 180)"/>
  <rect x="1150" y="220" width="26" height="13" rx="3" fill="#10b981" transform="rotate(-15 1150 220)"/>
